<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>深夜の旧病院 〜脱出〜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#000; overflow:hidden; touch-action:manipulation;
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif; color:#cfc8bd; user-select:none; -webkit-user-select:none; }
  #app { height:100%; height:100dvh; display:flex; flex-direction:column; max-width:560px; margin:0 auto; position:relative; }

  /* ===== top bar / inventory ===== */
  #topbar { flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:8px 10px; background:#0a0908; border-bottom:1px solid #221d18; z-index:5; }
  #roomname { font-size:13px; letter-spacing:2px; color:#8a7f6e; flex:1; white-space:nowrap; overflow:hidden; }
  .slot { width:44px; height:44px; border:1px solid #332b22; border-radius:6px; background:#120f0c;
    display:flex; align-items:center; justify-content:center; font-size:24px; position:relative; }
  .slot.sel { border-color:#a33; box-shadow:0 0 8px #a3333366; }
  .slot.pop { animation:pop .4s; }
  @keyframes pop { 0%{transform:scale(.3)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }

  /* ===== scene ===== */
  #stage { flex:1 1 auto; position:relative; overflow:hidden; background:#000; }
  .scene { position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .5s; }
  .scene.on { opacity:1; pointer-events:auto; }
  .scene svg { position:absolute; inset:0; width:100%; height:100%; }
  .hs { position:absolute; background:transparent; border:none; }
  .hs:active { background:rgba(255,255,255,.05); border-radius:8px; }

  /* darkness overlay before flashlight */
  #dark { position:absolute; inset:0; background:radial-gradient(circle at 50% 55%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.97) 55%, #000 75%); pointer-events:none; transition:opacity 1s; z-index:2; }
  #vignette { position:absolute; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,.75) 100%); }
  #flicker { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:4; }
  .flickering { animation:flick 4s infinite; }
  @keyframes flick { 0%,93%,100%{opacity:0} 94%{opacity:.5} 95%{opacity:0} 96.5%{opacity:.65} 97%{opacity:.1} 98%{opacity:.4} }

  /* ghost overlay */
  #ghost { position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:8; pointer-events:none; background:rgba(0,0,0,.82); }
  #ghost svg { width:75%; max-width:340px; filter:drop-shadow(0 0 25px rgba(180,200,255,.35)); }
  .shake { animation:shake .45s; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-9px,5px)} 40%{transform:translate(8px,-7px)} 60%{transform:translate(-7px,-4px)} 80%{transform:translate(6px,6px)} }

  /* ===== message window ===== */
  #msgbox { flex:0 0 auto; min-height:108px; background:#0a0908; border-top:1px solid #221d18; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); z-index:5; }
  #msg { font-size:14.5px; line-height:1.75; min-height:52px; white-space:pre-wrap; }
  #choices { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .btn { flex:1; min-width:110px; padding:12px 8px; background:#1a1410; color:#d8cfc0; border:1px solid #443728;
    border-radius:8px; font-size:15px; letter-spacing:1px; }
  .btn:active { background:#2c2118; }
  .btn.danger { border-color:#7a2020; color:#e0a0a0; }

  /* ===== modal (zoom views / keypad) ===== */
  #modal { position:absolute; inset:0; background:rgba(0,0,0,.92); z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  #modal.on { display:flex; }
  #modal-inner { width:100%; max-width:340px; background:#0f0d0a; border:1px solid #3a3024; border-radius:12px; padding:20px; text-align:center; }
  #modal-title { font-size:15px; color:#b0a690; margin-bottom:14px; letter-spacing:2px; }
  #modal-body { font-size:14px; line-height:1.8; }
  #pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
  #pad button { padding:14px 0; font-size:20px; background:#1a1610; color:#cfc5b0; border:1px solid #443a28; border-radius:8px; }
  #pad button:active { background:#332a1a; }
  #pad-disp { font-size:26px; letter-spacing:12px; background:#050505; border:1px solid #333; border-radius:6px;
    padding:8px; margin-bottom:6px; color:#7fff9f; font-family:monospace; min-height:48px; }
  #modal-close { margin-top:12px; width:100%; }

  /* ===== title / ending ===== */
  .fullscreen { position:absolute; inset:0; z-index:20; background:#000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:30px; transition:opacity 1.2s; }
  .fullscreen.hidden { opacity:0; pointer-events:none; }
  #title h1 { font-size:30px; letter-spacing:8px; color:#9b1c1c; text-shadow:0 0 18px #5c0a0a; margin-bottom:6px; font-weight:600; }
  #title h2 { font-size:15px; letter-spacing:6px; color:#6b6253; margin-bottom:50px; font-weight:400; }
  #title p { font-size:12px; color:#555; line-height:2; margin-top:40px; }
  .titlebtn { padding:16px 50px; font-size:17px; letter-spacing:4px; background:transparent; color:#cfc8bd;
    border:1px solid #5c4a33; border-radius:4px; animation:breathe 2.6s infinite; }
  @keyframes breathe { 0%,100%{opacity:.5} 50%{opacity:1} }
  #ending h1 { font-size:26px; letter-spacing:6px; margin-bottom:24px; }
  #ending p { font-size:14px; line-height:2.2; color:#9a917f; margin-bottom:40px; }

  .bloodtext { color:#8f1d1d; text-shadow:0 0 8px #4d0808; }
</style>
</head>

<script>
'use strict';
/* ================= audio (WebAudio, no assets) ================= */
let AC=null, droneGain=null, heartTimer=null;
function audioInit(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  // low drone
  const o1=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain();
  o1.frequency.value=52; o2.frequency.value=52.7; o1.type='sawtooth'; o2.type='sine';
  g.gain.value=0.022;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=130;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(AC.destination);
  o1.start(); o2.start(); droneGain=g;
  // heartbeat loop
  heartTimer=setInterval(()=>{ thump(0); thump(0.28); }, 1700);
}
function thump(d){
  if(!AC) return;
  const t=AC.currentTime+d;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(58,t); o.frequency.exponentialRampToValueAtTime(34,t+0.14);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.34,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.20);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.25);
}
function sfx(kind){
  if(!AC) return;
  const t=AC.currentTime;
  if(kind==='click'){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='square'; o.frequency.value=900; g.gain.setValueAtTime(0.05,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.07);
  } else if(kind==='get'){
    [660,880,1320].forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.frequency.value=f; g.gain.setValueAtTime(0.08,t+i*0.09);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.09+0.25);
      o.connect(g); g.connect(AC.destination); o.start(t+i*0.09); o.stop(t+i*0.09+0.3);
    });
  } else if(kind==='unlock'){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(220,t); o.frequency.linearRampToValueAtTime(150,t+0.18);
    g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.32);
  } else if(kind==='scare'){
    const n=AC.createBufferSource(), buf=AC.createBuffer(1,AC.sampleRate*1.1,AC.sampleRate);
    const ch=buf.getChannelData(0);
    for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,1.6);
    n.buffer=buf;
    const g=AC.createGain(); g.gain.value=0.35;
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1100; f.Q.value=0.6;
    n.connect(f); f.connect(g); g.connect(AC.destination); n.start(t);
    const o=AC.createOscillator(),g2=AC.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(640,t); o.frequency.exponentialRampToValueAtTime(95,t+0.9);
    g2.gain.setValueAtTime(0.28,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
    o.connect(g2); g2.connect(AC.destination); o.start(t); o.stop(t+1.05);
  } else if(kind==='whisper'){
    const n=AC.createBufferSource(), buf=AC.createBuffer(1,AC.sampleRate*1.6,AC.sampleRate);
    const ch=buf.getChannelData(0);
    for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*0.5*Math.abs(Math.sin(i/2600));
    n.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2400; f.Q.value=2.5;
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.05,t+0.5); g.gain.linearRampToValueAtTime(0.0001,t+1.6);
    n.connect(f); f.connect(g); g.connect(AC.destination); n.start(t);
  }
}

/* ================= state ================= */
const S = {
  scene:null, light:false, drawerOpen:false, hasKey:false, treatOpen:false,
  cabinetOpen:false, hasDriver:false, hasFuse:false, breakerOpen:false,
  power:false, dollSeen:false, mirrorSeen:0, chartRead:false, boardRead:false, fileRead:false,
  items:[], selected:null, ended:false,
};
const ITEMS = {
  light: {icon:'🔦', name:'懐中電灯'},
  key:   {icon:'🗝️', name:'古い鍵'},
  driver:{icon:'🪛', name:'ドライバー'},
  fuse:  {icon:'🔌', name:'ヒューズ'},
};
const $=id=>document.getElementById(id);
const msgEl=$('msg'), choicesEl=$('choices');
let msgTimer=null;

function say(text){
  clearInterval(msgTimer); choicesEl.innerHTML='';
  msgEl.textContent='';
  let i=0;
  msgTimer=setInterval(()=>{
    msgEl.textContent=text.slice(0,++i);
    if(i>=text.length) clearInterval(msgTimer);
  },22);
}
function choices(list){
  choicesEl.innerHTML='';
  list.forEach(([label,fn,cls])=>{
    const b=document.createElement('button');
    b.className='btn'+(cls?' '+cls:''); b.textContent=label;
    b.onclick=()=>{ sfx('click'); fn(); };
    choicesEl.appendChild(b);
  });
}
function give(id){
  S.items.push(id); sfx('get'); renderItems();
  const idx=S.items.length-1, el=$('slot'+idx);
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
function renderItems(){
  for(let i=0;i<4;i++){
    const el=$('slot'+i), id=S.items[i];
    el.textContent=id?ITEMS[id].icon:'';
    el.classList.toggle('sel', id && S.selected===id);
    el.onclick=()=>{ if(!id)return; sfx('click');
      S.selected = (S.selected===id)?null:id; renderItems();
      say(S.selected?ITEMS[id].name+'を構えた。使いたい場所をタップしよう。':ITEMS[id].name+'をしまった。');
    };
  }
}
function useSel(){ const s=S.selected; S.selected=null; renderItems(); return s; }
function shake(){ const st=$('stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); }
function ghostFlash(ms=900, cb){
  sfx('scare'); shake();
  if(navigator.vibrate) navigator.vibrate([90,40,160]);
  $('ghost').style.display='flex';
  setTimeout(()=>{ $('ghost').style.display='none'; if(cb)cb(); }, ms);
}

/* ================= scenes ================= */
const ROOMNAMES = {room:'201号室', hall:'2階 廊下', treat:'処置室', exit:'非常口前'};
function go(scene){
  S.scene=scene;
  document.querySelectorAll('.scene').forEach(el=>el.classList.remove('on'));
  $('sc-'+scene).classList.add('on');
  $('roomname').textContent='■ '+ROOMNAMES[scene];
  $('dark').style.opacity = S.light ? 0 : 1;
}

/* ================= modal ================= */
function modal(title, bodyHTML){
  $('modal-title').textContent=title;
  $('modal-body').innerHTML=bodyHTML;
  $('modal').classList.add('on');
}
$('modal-close').onclick=()=>{ sfx('click'); $('modal').classList.remove('on'); };

function keypad(title, answer, onOk, onNg){
  let val='';
  modal(title, `<div id="pad-disp">----</div><div id="pad"></div>`);
  const disp=$('pad-disp'), pad=$('pad');
  '123456789C0⏎'.split('').forEach(k=>{
    const b=document.createElement('button'); b.textContent=k;
    b.onclick=()=>{
      sfx('click');
      if(k==='C') val='';
      else if(k==='⏎'){
        if(val===answer){ $('modal').classList.remove('on'); onOk(); }
        else { val=''; disp.textContent='ERROR'; sfx('whisper'); if(onNg)onNg(); return; }
      }
      else if(val.length<4) val+=k;
      disp.textContent = val.padEnd(4,'-');
    };
    pad.appendChild(b);
  });
}

/* ================= interactions ================= */
const ACT = {
  /* ---- 201号室 ---- */

  },
  'room-drawer'(){

      S.drawerOpen=true; sfx('unlock');

    }, ()=>{ if(!S.chartRead) say('開かない。どこかに番号のヒントがあるはずだ。'); });
  },

        setTimeout(()=>go('hall'), 900);
      } else {
        say('ドアの外は真っ暗だ。明かりがないと一歩も進めない。');

    }
    go('hall'); say('軋む床。長い廊下に出た。');
  },

  /* ---- 廊下 ---- */
  'hall-blood'(){
    sfx('whisper');
    say('壁に赤黒い文字。──「みている」。\nまだ乾いていない。');
    if(!S.dollSeen && navigator.vibrate) navigator.vibrate(60);
  },
  'hall-board'(){
    S.boardRead=true;
    modal('掲示板', `
      <p style="text-align:left">色褪せた「おくすりの保管手順」が貼ってある。<br><br>
      <span style="font-size:22px">🔴 → 🔵 → 🟢 → 🟡</span><br><br>
      <span style="color:#777">「あか、あお、みどり、きいろ。<br>じゅんばん まもってね」</span><br>
      子供の字で書き足されている。</p>`);
  },
  'hall-wheel'(){
    say('誰もいない車椅子。\n車輪が、ゆっくりと回っている。');
    sfx('whisper');
  },
  'hall-treat'(){
    if(S.treatOpen){ go('treat'); say('薬品の匂いが鼻をつく。'); return; }
    if(useSel()==='key'){
      S.treatOpen=true; sfx('unlock');
      say('古い鍵が回った。処置室の扉が開く。');
      setTimeout(()=>{ go('treat'); say('薬品棚、ストレッチャー、曇った鏡──処置室だ。'); },800);
    } else {
      say('「処置室」。鍵がかかっている。');

  },
  'hall-exit'(){ go('exit'); say('廊下の突き当たり。非常口の前に立った。'); },
  'hall-back'(){ go('room'); say('201号室に戻った。'); },

  /* ---- 処置室 ---- */
  'treat-mirror'(){
    S.mirrorSeen++;
    if(S.mirrorSeen===2){
      ghostFlash(950, ()=>say('鏡の中で、長い髪の"何か"がこちらを見ていた。\n振り返っても、誰もいない。'));
    } else {
      say('曇った鏡。自分の顔が、いやに青白い。\n…後ろに、何か映らなかったか?');
      sfx('whisper');
    }
  },
  'treat-doll'(){
    S.dollSeen=true;
    say('ストレッチャーの上に古い人形。\n「……あそんでくれるの?」\n──気のせいだ。気のせいに決まってる。');
    sfx('whisper');
    if(navigator.vibrate) navigator.vibrate(40);
  },
  'treat-files'(){
    S.fileRead=true;
    modal('診療記録の束', `
      <p style="text-align:left">ほとんど黴びて読めないが、一枚だけ──<br><br>
      <span style="color:#999">「201号室 佐倉ミサキ<br>
      ○月13日 <b style="color:#c66">午前 2:44</b> 死亡確認」</span><br><br>
      <span class="bloodtext">余白に小さく「でられないよ」と書かれている。</span></p>`);
  },
  'treat-cab'(){
    if(S.cabinetOpen){ say('薬品棚はもう空だ。'); return; }
    colorLock();
  },
  'treat-back'(){ go('hall'); say('廊下に戻った。'); },

  /* ---- 非常口前 ---- */
  'exit-breaker'(){
    if(S.power){ say('配電盤。ブレーカーは入っている。'); return; }
    if(!S.breakerOpen){
      if(useSel()==='driver'){
        S.breakerOpen=true; sfx('unlock');
        say('ドライバーでネジを外し、配電盤の蓋を開けた。\nヒューズが1本、抜き取られている。');
      } else {
        say('配電盤。蓋がネジで固く閉じられている。工具が要る。');
      }
      return;
    }
    if(useSel()==='fuse'){
      S.power=true;
      say('ヒューズを差し込み、ブレーカーを上げた。');
      setTimeout(()=>{
        ghostFlash(1000, ()=>{
          say('非常灯が点いた瞬間──すぐ後ろに立っていた。\n少女が。笑っていた。\n…急げ。扉を開けるんだ。');
        });
      }, 700);
    } else {
      say('ヒューズの差し込み口が空っぽだ。代わりを探そう。');

  },
  'exit-keypad'(){
    if(!S.power){ say('テンキーの画面は真っ暗。「停電中ハ操作デキマセン」。'); return; }

      sfx('unlock'); finale();

  },
  'exit-door'(){
    if(!S.power) say('非常口は電子ロックで封鎖されている。電源が落ちているようだ。');

function colorLock(){
  modal('薬品棚のロック', `
    <p>4色のボタンが並んでいる。<br>正しい順番で押せ。</p>
    <div id="pad" style="grid-template-columns:repeat(4,1fr)">
      <button data-c="y" style="font-size:24px">🟡</button>
      <button data-c="g" style="font-size:24px">🟢</button>
      <button data-c="r" style="font-size:24px">🔴</button>
      <button data-c="b" style="font-size:24px">🔵</button>
    </div>
    <div id="pad-disp" style="letter-spacing:6px">----</div>`);
  let seq='';
  $('pad').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      sfx('click'); seq+=b.dataset.c;
      $('pad-disp').textContent=('●'.repeat(seq.length)).padEnd(4,'-');
      if(seq.length===4){
        if(seq==='rbgy'){
          $('modal').classList.remove('on');
          S.cabinetOpen=true; sfx('unlock');
          say('ガチャン。薬品棚が開いた。\n【ドライバー】と【ヒューズ】を手に入れた。');
          give('driver'); setTimeout(()=>give('fuse'),350);
        } else {
          seq=''; $('pad-disp').textContent='----'; sfx('whisper');
          if(!S.boardRead) say('開かない。順番のヒントがどこかに…。');
        }
      }
    };
  });
}

/* ================= finale ================= */
function finale(){
  say('ロック解除──重い扉が開いた!\n背後から、裸足の足音が走ってくる…!!');
  if(navigator.vibrate) navigator.vibrate([120,60,120,60,200]);
  choices([
    ['振り返らず走る', ()=>ending(true)],
    ['振り返る', ()=>ending(false), 'danger'],
  ]);
}
function ending(good){
  if(S.ended) return; S.ended=true;
  if(!good){
    ghostFlash(1400, ()=>{
      $('end-title').textContent='BAD END';
      $('end-title').className='bloodtext';
      $('end-text').innerHTML='振り返った先に、彼女の顔があった。<br>「みつけた」<br><br>あなたが病院を出ることは、二度となかった。<br>今夜もどこかで、車輪の回る音がする──。';
      showEnd();
    });
  } else {
    sfx('scare');
    setTimeout(()=>{
      $('end-title').textContent='ESCAPE SUCCESS';
      $('end-title').style.color='#7fae7f';
      $('end-text').innerHTML='夜気が肺に流れ込む。あなたは外に出た。<br><br>振り返ると、2階の窓に小さな影。<br>少女は手を振っていた。<br><br>「またね」<br><br>── 脱出成功 ──';
      showEnd();
    }, 1200);
  }
}
function showEnd(){
  $('ending').classList.remove('hidden');
  if(droneGain) droneGain.gain.linearRampToValueAtTime(0.004, AC.currentTime+2);
  clearInterval(heartTimer);
}

/* ================= boot ================= */
document.querySelectorAll('.hs').forEach(b=>{
  b.addEventListener('click',()=>{ if(!S.ended) ACT[b.dataset.act](); });
});
$('start').onclick=()=>{
  audioInit(); sfx('unlock');
  $('title').classList.add('hidden');
  go('room');
  say('──ふと、目が覚めた。\nここは…病院? 廃墟のはずの、あの旧病院の中だ。\nなぜ自分がここにいるのか、思い出せない。\n\n気になる場所をタップして調べよう。');
  // random ambient whisper
  setInterval(()=>{ if(!S.ended && Math.random()<0.30) sfx('whisper'); }, 12000);
};
$('retry').onclick=()=>location.reload();
renderItems();
