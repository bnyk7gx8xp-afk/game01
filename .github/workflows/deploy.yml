name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, "claude/browser-escape-game-horror-hwe6ee"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップしました。リポジトリの Settings > Secrets and variables > Actions に追加してください。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p dist && cp index.html dist/
          npx wrangler@4 pages project create kyu-byoin-escape --production-branch=main 2>/dev/null || true
          npx wrangler@4 pages deploy dist --project-name=kyu-byoin-escape --branch=main
